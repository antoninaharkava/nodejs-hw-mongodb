tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Set new password'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'JWT Token from reset email link'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2Nzk2ZmMyMjQ1NDg4M2I0MDMzNjQzYmUiLCJlbWFpbCI6Ijg0NWJjYTAwMUBzbXRwLWJyZXZvLmNvbSIsImlhdCI6MTczNzk4ODgxOSwiZXhwIjoxNzM3OTg5MTE5fQ.0GO3OQCgZyM9mdWaG8h7GFajiAjAX-qp2NeUiET4M4w'
          password:
            description: 'User new password'
            type: 'string'
            example: '787877'
responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    $ref: ../../../components/responses/reset-pwd/401.yaml
  '404':
    $ref: ../../../components/responses/send-reset-email/404.yaml
